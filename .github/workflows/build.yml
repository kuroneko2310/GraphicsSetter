name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore Source/GraphicSetter/GraphicSetter/GraphicSetter.csproj --verbosity quiet *> restore.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content restore.log | Select-String -Pattern 'error|failed' -CaseSensitive:$false
            exit $LASTEXITCODE
          }
          dotnet build Source/GraphicSetter/GraphicSetter/GraphicSetter.csproj --configuration Release --no-restore --nologo --verbosity quiet /clp:ErrorsOnly *> build.log
          $exitCode = $LASTEXITCODE
          Get-Content build.log | Select-String -Pattern ': error '
          exit $exitCode
