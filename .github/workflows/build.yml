name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Source/GraphicSetter/GraphicSetter/GraphicSetter.csproj --verbosity quiet
      - name: Build
        shell: pwsh
        run: |
          dotnet build Source/GraphicSetter/GraphicSetter/GraphicSetter.csproj --configuration Release --no-restore --nologo --verbosity quiet /clp:ErrorsOnly *> build.log
          $exitCode = $LASTEXITCODE
          Get-Content build.log | Select-String -Pattern ': error '
          exit $exitCode
